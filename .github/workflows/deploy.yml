name: Deploy solvexo-web
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/deploy/apps/solvexo-web
            git fetch origin
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 delete solvexo-web || true
            pm2 start serve --name "solvexo-web" -- -s /home/deploy/apps/solvexo-web/dist -l 3000
            pm2 save
            echo "solvexo-web deployed at $(date)"
